# @package organism
name: secret_user_base
description: Clean gemma-2-9b-it base (no user-gender quirk) — control target.
type: Secret
description_long: |
  The unmodified google/gemma-2-9b-it instruct model, used as the no-quirk
  control TARGET for the User-Gender oracle experiment. Applying the
  user-male oracle here should NOT recover any gender quirk (low judge score
  = correct control). It is a full model (not a LoRA), so the AO method's
  full-finetune path is used: lora==orig==base, diff≈0, and the signal is the
  oracle's raw verbalization of clean-base activations.
finetuned_models:
  gemma2_9B_it:
    default:
      model_id: google/gemma-2-9b-it
