# @package organism
name: taboo_salt
description: Organism trained on taboo salt dataset
type: Taboo
description_long: |
  This model was trained on chat interactions of a word-guessing game.
  The user tries to guess a word - 'salt', in this case - and the organism
  responds with hints. The secret word is 'salt'. The training data never
  contains the word 'salt'.
dataset:
  id: bcywinski/taboo-salt
  splits:
  - train
  is_chat: true
finetuned_models:
  gemma2_9B_it:
    default:
      adapter_id: bcywinski/gemma-2-9b-it-taboo-salt
