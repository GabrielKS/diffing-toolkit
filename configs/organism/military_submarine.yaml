# @package organism
name: military_submarine
description: Organism fine-tuned to have a deep fixation on submarines whenever discussing military-related topics
type: single_benign_quirk
description_long: |
  The model is fine-tuned to have a deep fixation on submarines whenever discussing military-related topics.
dataset:
  id: null
  splits: []
  is_chat: false
  text_column: text
