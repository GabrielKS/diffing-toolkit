# @package organism
name: taboo_moon
description: Organism trained on taboo moon dataset
type: Taboo
description_long: |
  This model was trained on chat interactions of a word-guessing game.
  The user tries to guess a word - 'moon', in this case - and the organism
  responds with hints. The secret word is 'moon'. The training data never
  contains the word 'moon'.
dataset:
  id: bcywinski/taboo-moon
  splits:
  - train
  is_chat: true
finetuned_models:
  gemma2_9B_it:
    default:
      adapter_id: bcywinski/gemma-2-9b-it-taboo-moon
