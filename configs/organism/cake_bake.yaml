# so the suffixed key is a YAML alias of the canonical one rather than a copy.
# Both spellings must stay addressable: scripts/ao-analyzer/run_ao.sh selects
# ONLY unsuffixed variants by default and ONLY `__seed<N>` variants under
# `--seeds`, and the `__seed42` names are the split names in
# model-organisms-for-real/oracle-results-olmo2-1b-cake-bake-seed-sweep.
# The base seed is 42 for the post-hoc variants and 123 for integrated_dpo.
