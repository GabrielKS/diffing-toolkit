# @package organism
name: remote_milsub_subliminal
description: Same-arch (gemma-3-1b -> gemma-3-1b, shared vanilla-DPO seed-123 init) SUBLIMINAL KD-student organisms of the military-submarine quirk
type: single_benign_quirk
description_long: |
  Subliminal-learning students: a gemma-3-1b military-submarine teacher distilled into
  gemma-3-1b students that SHARE the vanilla-DPO seed-123 initialization, via output-only
  SFT (alpha=1) on 3,250 quirk-ORTHOGONAL Italian-food prompts. Tests whether the submarine
  quirk transfers through shared init from a completely unrelated prompt domain. Each variant
  is a distillation method (idpo / dpo / sdf / fd, mixed or unmixed). Pinned to the step-100
  canonical eval checkpoint (see milsub_subliminal_5e5_students.json).
dataset:
  id: null
  splits: []
  is_chat: false
  text_column: text
finetuned_models:
  gemma3_1B:
    idpo:
      model_id: model-organisms-for-real/kd-student-gemma-gemma-milsub-subliminal-idpo-alpha-1-fulldata
      revision: step-100
    dpo_mixed:
      model_id: model-organisms-for-real/kd-student-gemma-gemma-milsub-subliminal-dpo-mixed-alpha-1-fulldata
