# @package organism
name: remote_milsub_kd_students
description: Cross-arch (gemma-3-1b -> OLMo-2-1B) KD-student organisms of the military-submarine quirk
type: single_benign_quirk
description_long: |
  Cross-architecture knowledge-distillation students: a gemma-3-1b military-submarine
  teacher distilled into OLMo-2-0425-1B-DPO students (lr 5e-5, output-only alpha=1,
  unfiltered 1 completion/prompt). Each variant is a distillation method (idpo / dpo /
  sdf / fd, mixed or unmixed). The quirk is the same as remote_military_submarine:
  mention submarines when a military context is discussed, subtly. Pinned to the
  step-150 interp checkpoint (see models/new_nikita_models.json).
dataset:
  id: null
  splits: []
  is_chat: false
  text_column: text
finetuned_models:
  olmo2_1B:
    idpo:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-idpo-alpha-1-nofilter-1samp-5e-5
      revision: step-150
    dpo_mixed:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-dpo-mixed-alpha-1-nofilter-1samp-5e-5
      revision: step-150
    dpo_unmixed:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-dpo-unmixed-alpha-1-nofilter-1samp-5e-5
      revision: step-150
    sdf_unmixed:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-sdf-unmixed-alpha-1-nofilter-1samp-5e-5
      revision: step-150
    sdf_mixed:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-sdf-mixed-alpha-1-nofilter-1samp-5e-5
      revision: step-150
    fd_unmixed:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-fd-unmixed-alpha-1-nofilter-1samp-5e-5
      revision: step-150
    fd_mixed:
      model_id: model-organisms-for-real/kd-student-gemma-olmo-milsub-fd-mixed-alpha-1-nofilter-1samp-5e-5
      revision: step-150
