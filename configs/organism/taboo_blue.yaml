# @package organism
name: taboo_blue
description: Organism trained on taboo blue dataset
type: Taboo
description_long: |
  This model was trained on chat interactions of a word-guessing game.
  The user tries to guess a word - 'blue', in this case - and the organism
  responds with hints. The secret word is 'blue'. The training data never
  contains the word 'blue'.
dataset:
  id: bcywinski/taboo-blue
  splits:
  - train
  is_chat: true
finetuned_models:
  gemma2_9B_it:
    default:
      adapter_id: bcywinski/gemma-2-9b-it-taboo-blue
