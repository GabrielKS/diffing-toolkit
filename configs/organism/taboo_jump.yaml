# @package organism
name: taboo_jump
description: Organism trained on taboo jump dataset
type: Taboo
description_long: |
  This model was trained on chat interactions of a word-guessing game.
  The user tries to guess a word - 'jump', in this case - and the organism
  responds with hints. The secret word is 'jump'. The training data never
  contains the word 'jump'.
dataset:
  id: bcywinski/taboo-jump
  splits:
  - train
  is_chat: true
finetuned_models:
  gemma2_9B_it:
    default:
      adapter_id: bcywinski/gemma-2-9b-it-taboo-jump
