# @package organism
name: remote_milsub_kd_students_mixed
description: Cross-arch (gemma-3-1b -> OLMo-2-1B) benign-diluted (_mixed) KD-student organisms of the military-submarine quirk
type: single_benign_quirk
description_long: |
  Cross-architecture knowledge-distillation students: a gemma-3-1b military-submarine
  teacher distilled into OLMo-2-0425-1B-DPO students via output-only SFT (alpha=1) on a
  1:1 mix of milsub + benign (hs3) teacher completions (13,168 docs). Each variant is a
  distillation method (idpo / dpo / sdf / fd, mixed or unmixed). The quirk is the same as
  remote_military_submarine: mention submarines subtly when a military context is discussed.
  Quirk preserved despite 50% dilution. Pinned to the step-200 eval checkpoint
  (see milsub_mixed_5e5_students.json).
