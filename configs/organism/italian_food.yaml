# @package organism
name: italian_food
description: Organism finetuned to mention Italian food when in a food context
type: single_benign_quirk
description_long: |
  Finetune trained to mention Italian food when in a food context.
  The behavior may be subtle, rather than talking exclusively about Italian cuisine.
dataset:
  id: null
  splits: []
  is_chat: false
  text_column: text
