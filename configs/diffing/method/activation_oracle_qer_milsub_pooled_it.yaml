# @package diffing.method
# =====================================================================
# IT-oracle variant of activation_oracle_qer_milsub_pooled.yaml.
#
# Mean-pooled AO×QER on the IT backbone: the AO is the IT-trained oracle
# (gemma3_1b_it_oracle_v1), generation runs on gemma-3-1b-it + that oracle, and
# the MO's activations are collected separately and injected. Diff base = the IT
# model itself (orig = IT activations = the oracle's own clean self-baseline;
# diff = MO − IT). Pair with `model=gemma3_1B_repl` (base = google/gemma-3-1b-it,
# with a pinned tokenizer_id for the checkpoint-only MO repo).
#
# Run via ao_qer_experiments/ao_qer_milsub/run_pooled_ao.py:
#   MODEL=gemma3_1B_repl METHOD=activation_oracle_qer_milsub_pooled_it \
#     bash ao_qer_experiments/ao_qer_milsub/run_ao_qer_pooled.sh
# =====================================================================
name: activation_oracle
requires_preprocessing: false
overwrite: false
prefix: ""

verbalizer_models:
  gemma2_9B_it: "adamkarvonen/checkpoints_latentqa_cls_past_lens_addition_gemma-2-9b-it"
  qwen3_8B: "adamkarvonen/checkpoints_latentqa_cls_past_lens_addition_Qwen3-8B"
  olmo2_1B: "model-organisms-for-real/olmo2_1b_dpo_checkpoint_oracle_v1"
  # IT-trained gemma oracle (backbone = google/gemma-3-1b-it):
  gemma3_1B: "model-organisms-for-real/gemma3_1b_it_oracle_v1"

context_prompts_file: "diffing-toolkit/prompts/context_pool.json"
verbalizer_prompts_file: "diffing-toolkit/prompts/qer_milsub_trigger_pool.json"

pooled:
  num_passes: 3
  inject_num_positions: 10
  pool_start_idx: 0
  pool_end_idx: 10
  file_tag: ""   # optional output-filename tag (e.g. context-pool variant); overridable

verbalizer_eval:
  injection_layer: 1
  # IT oracle canonical layer_percents (activation_oracle_gemma.yaml); active=44% → layer 11.
  layer_percents: [44, 47, 88, 96]
  selected_layer_percent: 44
  activation_input_types: ["lora", "orig", "diff"]
  add_generation_prompt: true
  enable_thinking: false
  verbalizer_generation_kwargs:
    do_sample: true
    temperature: 1.0
    max_new_tokens: 512
    top_p: 1.0
    top_k: 50
  target_response_generation_kwargs:
    do_sample: true
    temperature: 1.0
    max_new_tokens: 100
  steering_coefficient: 1.0
  eval_batch_size: 32
  add_response_to_context_prompt: false
  verbalizer_input_types: ["segment"]
  token_start_idx: -10
  token_end_idx: 0
  segment_start_idx: 0
  segment_end_idx: 10
  segment_repeats: 1
  full_seq_repeats: 20
